# docker compose up --build   ->  http://localhost:8000/review, /docs, /transactions
# Settings come from .env (copy .env.example); without a GEMINI_API_KEY unknown descriptions fall back, flagged.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: transactions
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d transactions"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://app:app@db:5432/transactions
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,web
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-0}
      SEED_CSV: ${SEED_CSV:-data/transaction_history.csv}
      CATEGORISER_PROVIDER: ${CATEGORISER_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CATEGORISER_TIMEOUT_SECONDS: ${CATEGORISER_TIMEOUT_SECONDS:-10}
      REVIEW_THRESHOLD: ${REVIEW_THRESHOLD:-0.6}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/categories"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
